name: Build TokenGPT Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Package EXEs
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TokenGPT" main.py
          pyinstaller --noconfirm --onefile --windowed --name "SoloFarmer" solo_farmer.py
      - name: Upload Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: TokenGPT-Windows
          path: |
            dist/TokenGPT.exe
            dist/SoloFarmer.exe