name: Build TokenGPT Windows EXE

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Package EXEs
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TokenGPT" main.py
          pyinstaller --noconfirm --onefile --windowed --name "SoloFarmer" solo_farmer.py
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TokenGPT & SoloFarmer Windows EXEs
          files: |
            dist/TokenGPT.exe
            dist/SoloFarmer.exe